name: "github action var scope learning"

on:
  workflow_dispatch:

env:
  WORKFLOW_VAR: I_AM_WORKFLOW_SCOPED
jobs:
  job1:
    runs-on: ubuntu-22.04
    env:
      JOB_VAR: I_AM_JOB1_SCOPED
    steps:
      - name: inspect scope job 1 step 1
        env:
          STEP1_VAR: I_AM_STEP_1_SCOPED
        run: |
          echo "WORKFLOW_VAR: $WORKFLOW_VAR"
          echo "JOB1_VAR: $JOB1_VAR"
          echo "STEP1_VAR: $STEP1_VAR"

      - name: inspect scope job 1 step 2
        run: |
          echo "WORKFLOW_VAR: $WORKFLOW_VAR"
          echo "JOB1_VAR: $JOB1_VAR"
          echo "STEP1_VAR: ${STEP1_VAR: -<UNSET>}"

  job2:
    run-on: ubuntu-22.04
    steps:
      - name: inspect scopes job 2
        run: |
          echo "WORKFLOW_VAR: $WORKFLOW_VAR"
          echo "JOB1_VAR: ${JOB1_VAR: -<UNSET>}"
          echo "STEP1_VAR: ${STEP1-VAR: -<UNSET>}"

        
