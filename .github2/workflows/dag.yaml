name: DAG Needs Block Pipeline to Run Dependent Jobs

on:
  workflow_dispatch:

jobs:
  job1:
    runs-on: ubuntu-22.04
    steps:
      - run: echo "This job-1 will execute successfully first"

  job2:
    runs-on: ubuntu-22.04
    needs:
      - job1
    steps:
      - run: echo "This job-2 will execute only after job-1 succeeds"

  job3:
    runs-on: ubuntu-22.04
    needs:
      - job1
      - job2
    steps:
      - run: echo "This job-3 will execute only after job-1 and job-2 succeed"